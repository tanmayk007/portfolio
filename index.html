<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanmay K — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;700;900&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* KEEPING YOUR ORIGINAL STYLE EXACT SAME */

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050505;
    --bg-card: #0c0c0c;
    --bg-card2: #111111;
    --green: #00ff88;
    --cyan: #00d4ff;
    --text: #e8e8e8;
    --text-muted: #666;
    --border: #1e1e1e;

    --font-display: 'Orbitron', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    --font-body: 'Sora', sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
    padding: 40px;
}

/* HERO IMAGE */

.hero-img{
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: 0 auto 50px;
    border: 3px solid var(--green);
}

/* GALLERY */

.gallery-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 20px;
}

.gallery-item{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s ease;
}

.gallery-item:hover{
    transform: translateY(-5px);
    border-color: var(--green);
}

.gallery-item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

</style>
</head>

<body>

<!-- HERO IMAGE FIXED -->

<img src="assets/images/profile.jpg" alt="Tanmay K" class="hero-img">

<!-- GALLERY FIXED -->

<div class="gallery-grid">

    <div class="gallery-item" onclick="openLightbox('assets/certificates/cert1.jpg')">
        <img src="assets/certificates/cert1.jpg" loading="lazy">
